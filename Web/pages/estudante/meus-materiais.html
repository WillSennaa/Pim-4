<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Materiais — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="historico.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <span class="top-bar__title">Meus Materiais</span>
    <a href="perfil.html" class="js-iniciais top-bar__avatar">-</a>
  </header>

  <main class="main-content">

    <h1 class="page-title animate-in">Meus Materiais</h1>
    <p class="page-subtitle">Todos os conteúdos que você já acessou ou marcou como concluído.</p>

    <!-- KPIs -->
    <div class="dashboard-grid mb-lg animate-in animate-in-delay-1">
      <div class="card" style="margin:0; border-top:3px solid var(--color-success);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">CONCLUÍDOS</div>
        <div class="font-bold" style="font-size:28px;" id="materiaisConcluidos">-</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid var(--color-warning);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">EM ANDAMENTO</div>
        <div class="font-bold" style="font-size:28px;" id="materiaisAndamento">-</div>
      </div>
      <!-- "FAVORITOS" nao existe no modelo (nao ha tabela de favorito):
           trocado pelo total de materiais dos cursos em que o aluno esta
           matriculado, que o banco sabe responder. -->
      <div class="card" style="margin:0; border-top:3px solid var(--color-primary);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">TOTAL DE MATERIAIS</div>
        <div class="font-bold" style="font-size:28px;" id="materiaisTotal">-</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid #8B5CF6;">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">HORAS TOTAIS</div>
        <div class="font-bold" style="font-size:28px;" id="materiaisHoras">-</div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="tabs tabs--pills mb-lg animate-in animate-in-delay-2">
      <button class="tab active" onclick="filtrarMateriais('todos', this)">Todos</button>
      <button class="tab" onclick="filtrarMateriais('concluido', this)">Concluídos</button>
      <button class="tab" onclick="filtrarMateriais('andamento', this)">Em andamento</button>
      <button class="tab" onclick="filtrarMateriais('favorito', this)"><i class="ti ti-star"></i> Favoritos</button>
    </div>

    <!-- Busca -->
    <div class="card animate-in animate-in-delay-2">
      <div class="form-input-wrapper">
        <i class="ti ti-search"></i>
        <input type="text" id="buscaMaterial" class="form-input form-input--with-icon" placeholder="Buscar material...">
      </div>
    </div>

    <div id="avisoFiltro"></div>
      <div id="materiaisList" class="animate-in animate-in-delay-3"></div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item active"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* Lista as aulas dos cursos em que o aluno esta matriculado, com o estado
   real de cada uma. Antes era um array fixo escrito nesta pagina.

   "Favoritos" nao existe no modelo de dados -- nao ha tabela para isso --,
   entao o filtro avisa em vez de mostrar uma lista vazia sem explicacao. */
function filtrarMateriais(tipo, botao) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  if (botao) botao.classList.add('active');

  const aviso = document.getElementById('avisoFiltro');
  if (aviso) aviso.innerHTML = '';

  if (tipo === 'favorito') {
    if (aviso) {
      aviso.innerHTML = '<div class="card" style="background:var(--color-warning-light); border-color:var(--color-warning);">' +
        '<p class="text-sm"><i class="ti ti-info-circle"></i> Favoritos nao estao no modelo de dados desta versao.</p></div>';
    }
    document.querySelectorAll('#materiaisList [data-concluido]').forEach(el => el.style.display = 'none');
    return;
  }

  document.querySelectorAll('#materiaisList [data-concluido]').forEach(el => {
    const concluido = el.dataset.concluido === 'true';
    const mostra = tipo === 'todos' || (tipo === 'concluido' && concluido) || (tipo === 'andamento' && !concluido);
    el.style.display = mostra ? '' : 'none';
  });
}

function onPageLoad() { carregarMeusMateriais(); }
</script>
</body>
</html>
