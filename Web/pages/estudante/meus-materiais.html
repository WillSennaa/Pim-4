<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Materiais — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="historico.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <span class="top-bar__title">Meus Materiais</span>
    <a href="perfil.html" class="top-bar__avatar">FA</a>
  </header>

  <main class="main-content">

    <h1 class="page-title animate-in">Meus Materiais</h1>
    <p class="page-subtitle">Todos os conteúdos que você já acessou ou marcou como concluído.</p>

    <!-- KPIs -->
    <div class="dashboard-grid mb-lg animate-in animate-in-delay-1">
      <div class="card" style="margin:0; border-top:3px solid var(--color-success);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">CONCLUÍDOS</div>
        <div class="font-bold" style="font-size:28px;">12</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid var(--color-warning);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">EM ANDAMENTO</div>
        <div class="font-bold" style="font-size:28px;">3</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid var(--color-primary);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">FAVORITOS</div>
        <div class="font-bold" style="font-size:28px;">5</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid #8B5CF6;">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">HORAS TOTAIS</div>
        <div class="font-bold" style="font-size:28px;">28h</div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="tabs tabs--pills mb-lg animate-in animate-in-delay-2">
      <button class="tab active" onclick="filtrarMateriais('todos', this)">Todos</button>
      <button class="tab" onclick="filtrarMateriais('concluido', this)">Concluídos</button>
      <button class="tab" onclick="filtrarMateriais('andamento', this)">Em andamento</button>
      <button class="tab" onclick="filtrarMateriais('favorito', this)"><i class="ti ti-star"></i> Favoritos</button>
    </div>

    <!-- Busca -->
    <div class="card animate-in animate-in-delay-2">
      <div class="form-input-wrapper">
        <i class="ti ti-search"></i>
        <input type="text" id="buscaMaterial" class="form-input form-input--with-icon" placeholder="Buscar material..." oninput="renderMateriais()">
      </div>
    </div>

    <div id="materiaisList" class="animate-in animate-in-delay-3"></div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="perfil.html" class="bottom-nav__item active"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<script src="../../js/app.js"></script>
<script>
// Materiais mockados (em um sistema real viriam do JSON)
const materiais = [
  { id: 1, titulo: 'Introdução a C#', curso: 'Fundamentos de C#', modulo: 'Módulo 1', status: 'concluido', favorito: true, data: 'Há 3 semanas', duracao: '30 min', tipo: 'aula', link: 'aula.html' },
  { id: 2, titulo: 'Sintaxe Básica de C#', curso: 'Fundamentos de C#', modulo: 'Módulo 2', status: 'concluido', favorito: true, data: 'Há 2 semanas', duracao: '40 min', tipo: 'aula', link: 'aula.html' },
  { id: 3, titulo: 'Arrays e Listas em C#', curso: 'Fundamentos de C#', modulo: 'Módulo 3', status: 'concluido', favorito: true, data: 'Há 2 horas', duracao: '45 min', tipo: 'aula', link: 'aula.html' },
  { id: 4, titulo: 'Estruturas de Repetição', curso: 'Fundamentos de C#', modulo: 'Módulo 4', status: 'andamento', favorito: false, data: 'Hoje', duracao: '50 min', tipo: 'aula', link: 'aula.html' },
  { id: 5, titulo: 'Introdução a Banco de Dados', curso: 'Banco de Dados e Modelagem', modulo: 'Módulo 1', status: 'concluido', favorito: false, data: 'Há 1 semana', duracao: '40 min', tipo: 'aula', link: 'aula-bd.html' },
  { id: 6, titulo: 'Modelagem Entidade-Relacionamento', curso: 'Banco de Dados e Modelagem', modulo: 'Módulo 2', status: 'concluido', favorito: true, data: 'Há 4 dias', duracao: '60 min', tipo: 'aula', link: 'aula-bd.html' },
  { id: 7, titulo: 'Análise de Sistemas e RUP', curso: 'Banco de Dados e Modelagem', modulo: 'Módulo 3', status: 'andamento', favorito: false, data: 'Ontem', duracao: '55 min', tipo: 'aula', link: 'aula-bd.html' },
  { id: 8, titulo: 'PDF: Cheat Sheet C#', curso: 'Fundamentos de C#', modulo: 'Apoio', status: 'concluido', favorito: true, data: 'Há 1 semana', duracao: '10 min', tipo: 'pdf', link: '#' }
];

let filtroAtual = 'todos';

function filtrarMateriais(f, btn) {
  filtroAtual = f;
  document.querySelectorAll('.tabs--pills .tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderMateriais();
}

function renderMateriais() {
  const busca = (document.getElementById('buscaMaterial').value || '').toLowerCase();
  let m = materiais;
  if (filtroAtual === 'concluido') m = m.filter(x => x.status === 'concluido');
  if (filtroAtual === 'andamento') m = m.filter(x => x.status === 'andamento');
  if (filtroAtual === 'favorito') m = m.filter(x => x.favorito);
  if (busca) m = m.filter(x => x.titulo.toLowerCase().includes(busca) || x.curso.toLowerCase().includes(busca));

  const list = document.getElementById('materiaisList');
  if (m.length === 0) {
    list.innerHTML = `<div class="card text-center" style="padding:var(--space-2xl);">
      <i class="ti ti-mood-empty" style="font-size:48px; color:var(--color-text-muted);"></i>
      <p class="text-muted mt-md">Nenhum material encontrado.</p>
    </div>`;
    return;
  }

  list.innerHTML = m.map(x => {
    const icone = x.tipo === 'pdf' ? 'ti-file-text' : 'ti-play-circle';
    const statusClass = x.status === 'concluido' ? 'success' : 'warning';
    const statusLabel = x.status === 'concluido' ? 'CONCLUÍDO' : 'EM ANDAMENTO';
    return `<div class="card">
      <div class="flex items-start gap-md">
        <div class="list-item__icon list-item__icon--${statusClass}" style="width:48px; height:48px;">
          <i class="ti ${icone}" style="font-size:22px;"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div class="flex justify-between items-start mb-sm" style="gap:var(--space-sm);">
            <h4 class="font-bold">${x.titulo}</h4>
            <button onclick="toggleFavorito(${x.id})" style="background:none; border:none; cursor:pointer; color:${x.favorito ? 'var(--color-warning)' : 'var(--color-text-muted)'}; font-size:20px;">
              <i class="ti ti-star${x.favorito ? '-filled' : ''}"></i>
            </button>
          </div>
          <div class="text-sm text-secondary mb-sm">${x.curso} · ${x.modulo}</div>
          <div class="flex gap-md text-xs text-muted mb-md" style="flex-wrap:wrap;">
            <span><i class="ti ti-clock"></i> ${x.duracao}</span>
            <span><i class="ti ti-calendar"></i> ${x.data}</span>
            <span class="badge badge--${statusClass}">${statusLabel}</span>
          </div>
          <div class="flex gap-sm">
            <a href="${x.link}" class="btn btn--primary btn--sm" style="flex:1;">
              ${x.status === 'concluido' ? '<i class="ti ti-rotate"></i> Revisar' : '<i class="ti ti-player-play"></i> Continuar'}
            </a>
            ${x.tipo === 'pdf' ? '<button class="btn btn--ghost btn--sm" onclick="alert(\'📥 Download iniciado!\');"><i class="ti ti-download"></i></button>' : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleFavorito(id) {
  const m = materiais.find(x => x.id === id);
  if (m) {
    m.favorito = !m.favorito;
    renderMateriais();
  }
}

function onPageLoad() {
  renderMateriais();
}
</script>
</body>
</html>
