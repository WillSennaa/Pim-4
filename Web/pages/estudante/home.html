<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar__brand">
      <span>Tech Quest</span>
    </div>
    <div class="top-bar__actions">
      <a href="notificacoes.html" class="top-bar__icon-btn top-bar__icon-btn--badge"><i class="ti ti-bell" style="font-size:22px;"></i></a>
      <a href="perfil.html" class="top-bar__avatar" id="userInitials">FA</a>
    </div>
  </header>

  <main class="main-content">

    <!-- Saudação -->
    <div class="welcome-block animate-in">
      <h1 class="welcome-block__hello">Olá, <span id="userName">...</span>! <span class="wave">👋</span></h1>
      <p class="welcome-block__date" id="dataDeHoje">carregando...</p>
    </div>

    <!-- Card de nível -->
    <div class="card card--accent-warning animate-in animate-in-delay-1">
      <div class="level-card">
        <div class="level-card__avatar-wrapper">
          <div class="level-card__avatar js-iniciais" style="background:linear-gradient(135deg, #475569, #64748B); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:32px;">--</div>
          <div class="level-card__badge" id="userLevel">-</div>
        </div>
        <div class="level-card__title">
          <i class="ti ti-medal" style="vertical-align:-2px;"></i>
          Nível <span id="userLevelText">--</span>
        </div>
        <div class="level-card__xp">
          <span><span id="userXP">0</span> / <span id="userXPNext">0</span> XP para o Nível <span id="userProximoNivel">--</span></span>
          <span class="text-primary font-semibold" id="userProgressLabel">0%</span>
        </div>
        <div class="progress">
          <div class="progress__fill" id="userProgressBar" style="width:0%"></div>
        </div>
        <p class="level-card__quote" id="userQuote"></p>
      </div>
    </div>

    <!-- Conquistas Recentes -->
    <div class="card animate-in animate-in-delay-2">
      <div class="card__header">
        <h3 class="card__title">CONQUISTAS RECENTES</h3>
        <a href="../estudante/conquistas.html" class="text-warning"><i class="ti ti-star-filled" style="font-size:20px;"></i></a>
      </div>
      <div id="conquistasList"></div>
    </div>

    <!-- Cursos em andamento: um cartao por matricula ativa, de
         /api/perfil/historico. Antes eram dois cartoes escritos aqui. -->
    <h3 class="section-title mt-lg">Continue de onde parou</h3>
    <div id="cursosEmAndamento">
      <div class="card"><p class="text-sm text-muted">Carregando seus cursos...</p></div>
    </div>

    <!-- Prova liberada: aparece quando existe curso com 100% dos materiais
         concluidos e prova cadastrada. A regra e a mesma do servidor. -->
    <div id="proximaProva"></div>

    <!-- Atalho certificados -->
    <a href="certificados.html" class="card flex items-center gap-md animate-in animate-in-delay-3" style="background:linear-gradient(135deg, #FEFCE8 0%, #FEF3C7 100%); border:1px solid #FCD34D; text-decoration:none;">
      <div class="list-item__icon list-item__icon--warning" style="width:48px; height:48px; font-size:24px;">
        <i class="ti ti-certificate"></i>
      </div>
      <div style="flex:1;">
        <div class="font-bold">Meus Certificados</div>
        <div class="text-xs text-secondary" id="atalhoCertificados">consultando...</div>
      </div>
      <i class="ti ti-chevron-right text-muted"></i>
    </a>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item active">
      <i class="ti ti-home"></i><span>Home</span>
    </a>
    <a href="cursos.html" class="bottom-nav__item">
      <i class="ti ti-book-2"></i><span>Cursos</span>
    </a>
    <a href="conquistas.html" class="bottom-nav__item">
      <i class="ti ti-trophy"></i><span>Conquistas</span>
    </a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item">
      <i class="ti ti-user"></i><span>Perfil</span>
    </a>
  </nav>

</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
function onPageLoad() {
  if (TQ.data) renderEstudanteHome();
}
</script>
</body>
</html>
