<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- O título era "Arrays e Listas em C#" fixo. renderAula() o troca pelo
       título real do material carregado. -->
  <title>Material — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="cursos.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <div class="text-center" style="flex:1; min-width:0;">
      <div class="text-xs text-muted">TECH QUEST</div>
      <div class="text-sm font-semibold text-primary" id="aulaTrilha"
           style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">carregando...</div>
    </div>
    <a href="perfil.html" class="top-bar__avatar js-iniciais">-</a>
  </header>

  <main class="main-content">

    <div class="flex items-center gap-sm mb-sm animate-in">
      <span class="badge badge--neutral" id="aulaTipo">MATERIAL</span>
      <span class="badge badge--primary" id="aulaNivel">-</span>
      <span id="aulaSeloConcluido"></span>
    </div>

    <h1 style="font-size:24px; font-weight:700; margin-bottom:var(--space-md);"
        class="animate-in" id="aulaTitulo">Carregando material...</h1>

    <!-- Tutor responsável. Antes: "Ana Souza · Especialista em Backend · 4.8".
         O cargo e a nota não existem no modelo — não há tabela de avaliação
         de tutor nem campo de especialidade. O nome vem do curso. -->
    <div class="card animate-in animate-in-delay-1">
      <div class="flex items-center gap-md">
        <div class="avatar" style="background:#FDA4AF; color:#9F1239;" id="aulaInstrutorIniciais">-</div>
        <div style="flex:1;">
          <div class="font-semibold text-sm" id="aulaInstrutor">-</div>
          <div class="text-xs text-muted">Tutor responsável · <span id="aulaCursoNome"></span></div>
        </div>
      </div>
    </div>

    <!-- SAÍRAM as abas "Conteúdo / Anotações / Material de Apoio".
         "Anotações" exigiria tabela de anotação por aluno e material;
         "Material de Apoio" exigiria armazenamento de arquivos. As duas
         mostravam a mesma frase ("em breve") desde o PIM III. Quando houver
         decisão de modelagem para elas, voltam com dado por trás. -->

    <!-- Conteúdo real do material: coluna Material.Conteudo -->
    <div class="animate-in animate-in-delay-2" id="aulaConteudo">
      <div class="card"><p class="text-sm text-muted">Carregando conteúdo...</p></div>
    </div>

    <!-- Botão de conclusão: o destino depende da posição na trilha
         (próximo material, prova ou volta ao curso). -->
    <div id="aulaAcoes"></div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item active"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
function onPageLoad() { renderAula(); }
</script>
</body>
</html>
