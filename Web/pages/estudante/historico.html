<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Histórico — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="perfil.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <div style="flex:1;">
      <div class="font-bold text-primary">Meu Histórico</div>
      <div class="text-xs text-muted">Linha do tempo de atividades</div>
    </div>
    <a href="perfil.html" class="top-bar__avatar">FA</a>
  </header>

  <main class="main-content">

    <div class="tabs tabs--pills mb-lg animate-in">
      <button class="tab active" onclick="filtrarHistorico('todos', this)">Tudo</button>
      <button class="tab" onclick="filtrarHistorico('material', this)"><i class="ti ti-book-2"></i> Materiais</button>
      <button class="tab" onclick="filtrarHistorico('prova', this)"><i class="ti ti-clipboard"></i> Provas</button>
    </div>

    <!-- Atalhos para páginas dedicadas -->
    <div class="dashboard-grid mb-lg" style="grid-template-columns:1fr 1fr;">
      <a href="meus-materiais.html" class="card flex items-center gap-md" style="margin:0; text-decoration:none; cursor:pointer;">
        <div class="list-item__icon"><i class="ti ti-book-2"></i></div>
        <div style="flex:1;">
          <div class="font-semibold text-sm">Meus Materiais</div>
          <div class="text-xs text-muted">Todos os conteúdos acessados</div>
        </div>
      </a>
      <a href="minhas-provas.html" class="card flex items-center gap-md" style="margin:0; text-decoration:none; cursor:pointer;">
        <div class="list-item__icon list-item__icon--success"><i class="ti ti-clipboard-check"></i></div>
        <div style="flex:1;">
          <div class="font-semibold text-sm">Minhas Provas</div>
          <div class="text-xs text-muted">Resultados e tentativas</div>
        </div>
      </a>
    </div>

    <div id="timelineList" class="animate-in animate-in-delay-1">
      <!-- Renderizado via JS -->
    </div>

    <button class="btn btn--ghost btn--full mt-lg" onclick="alert('📜 Carregando registros mais antigos...');">
      Carregar mais <i class="ti ti-chevron-down"></i>
    </button>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="perfil.html" class="bottom-nav__item active"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<script src="../../js/app.js"></script>
<script>
let filtroHist = 'todos';

function filtrarHistorico(tipo, btn) {
  filtroHist = tipo;
  document.querySelectorAll('.tabs--pills .tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderHistorico();
}

function renderHistorico() {
  if (!TQ.data) return;

  const tipoToBadge = {
    'concluido': { class: 'success', label: 'CONCLUÍDO', categoria: 'material' },
    'success': { class: 'success', label: 'APROVADO', categoria: 'prova' },
    'danger': { class: 'danger', label: 'REPROVADO', categoria: 'prova' },
    'warning': { class: 'warning', label: 'NOVA CONQUISTA', categoria: 'outro' },
    'default': { class: 'primary', label: 'ACESSO', categoria: 'material' }
  };

  let hist = TQ.data.historico;
  if (filtroHist === 'material') hist = hist.filter(h => (tipoToBadge[h.tipo] || tipoToBadge.default).categoria === 'material');
  if (filtroHist === 'prova') hist = hist.filter(h => (tipoToBadge[h.tipo] || tipoToBadge.default).categoria === 'prova');

  if (hist.length === 0) {
    document.getElementById('timelineList').innerHTML = `<div class="card text-center" style="padding:var(--space-2xl);">
      <i class="ti ti-history-toggle" style="font-size:48px; color:var(--color-text-muted);"></i>
      <p class="text-muted mt-md">Nenhum registro neste filtro.</p>
    </div>`;
    return;
  }

  const grupos = {};
  hist.forEach(h => {
    if (!grupos[h.data]) grupos[h.data] = [];
    grupos[h.data].push(h);
  });

  const html = Object.keys(grupos).map(dia => {
    return `<div class="timeline__day">${dia.toUpperCase()}</div>` + grupos[dia].map(item => {
      const b = tipoToBadge[item.tipo] || tipoToBadge.default;
      return `<div class="timeline__item timeline__item--${b.class === 'primary' ? '' : b.class}">
        <div class="timeline__card">
          <span class="timeline__time">${item.tempo}</span>
          <span class="badge badge--${b.class}">${b.label}</span>
          <div class="timeline__title mt-sm">${item.titulo}</div>
          <div class="timeline__subtitle">${item.subtitulo}</div>
        </div>
      </div>`;
    }).join('');
  }).join('');

  document.getElementById('timelineList').innerHTML = '<div class="timeline">' + html + '</div>';
}

function onPageLoad() {
  renderHistorico();
}
</script>
</body>
</html>
