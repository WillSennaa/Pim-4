<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Senha — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <main class="main-content" style="padding-top:var(--space-2xl);">

    <div class="card animate-in" style="padding:var(--space-2xl) var(--space-xl);">
      <div class="text-center mb-lg">
        <div style="width:56px; height:56px; background:var(--color-primary-light); color:var(--color-primary-dark); border-radius:var(--radius-full); display:inline-flex; align-items:center; justify-content:center; font-size:24px;">
          <i class="ti ti-lock"></i>
        </div>
      </div>

      <h2 class="text-center font-bold mb-sm" style="font-size:22px;">Alterar senha?</h2>
      <p class="text-center text-secondary text-sm mb-lg" style="line-height:1.6;">
        Certifique-se de escolher uma senha forte para manter sua conta segura.
      </p>

      <form onsubmit="event.preventDefault(); abrirModal('modalSalvo');">
        <div class="form-group">
          <label class="form-label">Senha atual</label>
          <div class="form-input-wrapper">
            <i class="ti ti-lock"></i>
            <input type="password" id="senhaAtual" class="form-input form-input--with-icon" placeholder="••••••••" required>
            <button type="button" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-text-muted);" onclick="toggleVisibility('senhaAtual')"><i class="ti ti-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <div class="form-input-wrapper">
            <i class="ti ti-lock"></i>
            <input type="password" id="novaSenha" class="form-input form-input--with-icon" placeholder="••••••••" oninput="calcularForca(this.value)" required>
            <button type="button" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-text-muted);" onclick="toggleVisibility('novaSenha')"><i class="ti ti-eye"></i></button>
          </div>
          <div class="mt-sm">
            <div class="flex justify-between text-xs mb-sm">
              <span class="text-muted">Força da senha</span>
              <span class="font-semibold" id="forcaLabel">Média</span>
            </div>
            <div class="progress progress--warning" style="height:4px;">
              <div class="progress__fill" id="forcaBar" style="width:55%"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirmar nova senha</label>
          <div class="form-input-wrapper">
            <i class="ti ti-lock-check"></i>
            <input type="password" id="confirmarSenha" class="form-input form-input--with-icon" placeholder="••••••••" required>
            <button type="button" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-text-muted);" onclick="toggleVisibility('confirmarSenha')"><i class="ti ti-eye"></i></button>
          </div>
        </div>

        <div class="card" style="background:var(--color-surface-2); padding:var(--space-md); margin:var(--space-md) 0;">
          <div class="text-xs font-semibold mb-sm" style="letter-spacing:1px;">REQUISITOS DE SEGURANÇA</div>
          <div class="flex items-center gap-sm text-sm mb-sm"><i class="ti ti-circle-check text-success"></i> Mínimo 8 caracteres</div>
          <div class="flex items-center gap-sm text-sm mb-sm"><i class="ti ti-circle text-muted"></i> Pelo menos 1 número</div>
          <div class="flex items-center gap-sm text-sm"><i class="ti ti-circle text-muted"></i> Pelo menos 1 caractere especial</div>
        </div>

        <div class="flex flex-col gap-sm">
          <a href="editar-perfil.html" class="btn btn--secondary btn--full">Cancelar</a>
          <button type="submit" class="btn btn--primary btn--full btn--lg">Alterar senha</button>
        </div>
      </form>
    </div>

  </main>

</div>

<div class="modal-overlay" id="modalSalvo">
  <div class="modal">
    <div class="modal__icon modal__icon--success"><i class="ti ti-check"></i></div>
    <h3 class="modal__title">Senha alterada!</h3>
    <p class="modal__text">Sua nova senha foi salva com sucesso.</p>
    <div class="modal__actions">
      <a href="perfil.html" class="btn btn--primary btn--full">OK</a>
    </div>
  </div>
</div>

<script src="../../js/app.js"></script>
<script>
function toggleVisibility(id) {
  const i = document.getElementById(id);
  i.type = i.type === 'password' ? 'text' : 'password';
}
function calcularForca(s) {
  let f = 0;
  if (s.length >= 8) f += 33;
  if (/\d/.test(s)) f += 33;
  if (/[^A-Za-z0-9]/.test(s)) f += 34;
  document.getElementById('forcaBar').style.width = f + '%';
  const labels = ['Fraca', 'Média', 'Forte'];
  const idx = f < 50 ? 0 : f < 90 ? 1 : 2;
  document.getElementById('forcaLabel').textContent = labels[idx];
}
</script>
</body>
</html>
