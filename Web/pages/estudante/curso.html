<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fundamentos de C# — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="home.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <span class="top-bar__title text-primary">Tech Quest</span>
    <a href="perfil.html" class="js-iniciais top-bar__avatar">-</a>
  </header>

  <main class="main-content">

    <!-- Hero do curso -->
    <div class="course-hero animate-in">
      <div class="course-hero__badges">
        <span class="badge" id="cursoCategoriaBadge" style="background:var(--color-primary); color:white;">-</span>
        <span class="badge" id="cursoNivelBadge" style="background:rgba(255,255,255,0.2); color:white;">-</span>
      </div>
      <h1 class="course-hero__title" id="cursoTitulo">Carregando...</h1>
      <p class="course-hero__text" id="cursoDescricao"></p>
      <div class="course-hero__instructor">
        <div class="avatar avatar--sm" style="background:#FDA4AF; color:#9F1239;" id="cursoInstrutorIniciais">AS</div>
        <div>
          <div class="course-hero__instructor-name" id="cursoInstrutor">-</div>
          <!-- "Senior Developer & Instrutora" era cargo escrito no HTML: o
               modelo nao guarda cargo de tutor, so o vinculo com o curso. -->
          <div class="course-hero__instructor-role">Tutor responsável pelo curso</div>
        </div>
      </div>
    </div>

    <!-- Progresso -->
    <div class="card animate-in animate-in-delay-1">
      <div class="flex justify-between mb-sm">
        <span class="font-medium">Progresso do Curso</span>
        <span class="text-primary font-semibold" id="cursoProgressoLabel">0%</span>
      </div>
      <div class="progress">
        <div class="progress__fill" id="cursoProgressoBarra" style="width:0%"></div>
      </div>
      <!-- O botao aparecia mesmo para quem ja estava matriculado. Agora o
           conteudo desta area depende do campo Matriculado do CursoDetalheDto. -->
      <div id="areaMatricula"></div>
    </div>

    <!-- Lista de aulas: preenchida pela API em renderCursoDetalhe() -->
    <h3 class="section-title mt-lg">Conteudo do Curso</h3>
    <p class="text-sm text-muted mb-md" id="cursoAulasResumo">Carregando aulas...</p>

    <div id="listaAulas"></div>

    <div id="areaProva" class="mt-lg"></div>

    <!-- SAIU o cartao "Recompensa".
         Dizia "C# Master Medal - ao concluir todos os modulos com nota acima
         de 80%" para qualquer curso. A tabela Medalha nao tem vinculo com
         Curso: as medalhas saem de regras gerais de gamificacao (materiais
         concluidos, provas aprovadas, nota 10), nao de um curso especifico.
         Prometer medalha de curso era prometer o que o modelo nao cumpre.
         As conquistas reais estao em conquistas.html. -->

    <!-- Informações -->
    <div class="card">
      <h4 class="font-semibold mb-md">Informações</h4>
      <div class="flex justify-between mb-sm"><span class="text-secondary">Categoria</span><span class="font-medium" id="cursoCategoria">-</span></div>
      <div class="flex justify-between mb-sm"><span class="text-secondary">Dificuldade</span><span class="text-primary font-medium" id="cursoDificuldade">-</span></div>
      <div class="flex justify-between"><span class="text-secondary">Duração Total</span><span class="font-medium" id="cursoDuracao">-</span></div>
      <!-- "Alunos inscritos 1.240" e "Ultima atualizacao Ago 2023" sairam:
           a contagem de matriculados por curso nao e exposta ao aluno por
           nenhum endpoint, e Curso nao tem coluna de data de atualizacao. -->
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="curso.html" class="bottom-nav__item active"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>
<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
function onPageLoad() { renderCursoDetalhe(); }
</script>
</body>
</html>
