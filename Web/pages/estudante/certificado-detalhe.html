<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="certificados.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <span class="top-bar__title">Certificado</span>
    <button class="top-bar__icon-btn" onclick="window.print()"><i class="ti ti-printer" style="font-size:22px;"></i></button>
  </header>

  <main class="main-content">

    <div id="certificadoConteudo" class="animate-in">
      <!-- Renderizado via JS -->
    </div>

    <!-- Ações -->
    <div class="flex gap-sm mt-lg flex-col animate-in animate-in-delay-2" id="acoesCert">
      <button class="btn btn--primary btn--lg btn--full" onclick="window.print()">
        <i class="ti ti-download"></i> Baixar em PDF
      </button>
      <!-- "Compartilhar no LinkedIn" era simulado. Usa a API de
           compartilhamento do navegador quando existe, e copia o link de
           validacao quando nao existe. Nenhuma das duas depende do banco. -->
      <button class="btn btn--secondary btn--full" onclick="compartilharCertificado(this)">
        <i class="ti ti-share"></i> Compartilhar
      </button>
      <a href="certificados.html" class="btn btn--ghost btn--full">Voltar</a>
    </div>

    <!-- Validação -->
    <div class="card mt-lg animate-in animate-in-delay-3">
      <h4 class="font-semibold mb-md"><i class="ti ti-shield-check text-primary" style="vertical-align:-2px;"></i> Validação do certificado</h4>
      <p class="text-sm text-secondary mb-md">Este certificado pode ser verificado publicamente por empresas e instituições através do código único de validação:</p>
      <div style="background:var(--color-surface-2); padding:var(--space-md); border-radius:var(--radius-md); font-family:monospace; text-align:center; font-weight:600; letter-spacing:1px;" id="codigoValidacao">-</div>
      <p class="text-xs text-muted mt-sm text-center">techquest.com/validar/<span id="urlValidacao">-</span></p>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<style>
@media print {
  .top-bar, .bottom-nav, .sidebar-nav, #acoesCert, .card:last-of-type, .persona-switcher { display: none !important; }
  .main-content { padding: 0 !important; }
  body, .app-container { background: white !important; }
}
</style>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* Buscava o id 'cert-001' no mock.json e imprimia nota final e instrutora
   fixas no certificado. Agora busca pelo CODIGO DE AUTENTICACAO (?codigo=),
   que e a chave publica do documento -- a mesma do endpoint de validacao. */
function onPageLoad() { carregarCertificadoDetalhe(); }

function compartilharCertificado(botao) {
  const codigo = document.getElementById('urlValidacao').textContent;
  const url = window.location.origin + '/validar/' + codigo;
  if (navigator.share) {
    navigator.share({ title: 'Meu certificado Tech Quest', url: url })
      .catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url)
      .then(() => avisar('Link de validacao copiado.', 'sucesso'))
      .catch(() => avisar('Nao foi possivel copiar o link.', 'erro'));
  } else {
    avisar('Codigo de validacao: ' + codigo, 'info');
  }
}
</script>
</body>
</html>
