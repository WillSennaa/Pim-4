<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprovado — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="cursos.html" class="top-bar__back"><i class="ti ti-x"></i></a>
    <span class="top-bar__title text-primary">Tech Quest</span>
    <span class="top-bar__avatar js-iniciais">-</span>
  </header>

  <main class="main-content">

    <div class="result-card result-card--success animate-in" style="border-radius:var(--radius-lg);">
      <div class="result-card__icon result-card__icon--success">
        <i class="ti ti-check"></i>
      </div>
      <h2 class="result-card__title">Parabéns, <span id="resultadoNome">estudante</span>! 🎉</h2>
      <p class="result-card__text">
        Você foi aprovado em <strong id="resultadoProva">-</strong>
        (nota mínima <span id="notaMinima">-</span>).
      </p>
      <div class="result-card__score">
        <div class="result-card__score-label">SUA NOTA</div>
        <div class="result-card__score-value" id="notaFinal">-</div>
        <div class="text-sm text-secondary">
          Acertou <span id="acertosTotal">-</span> questões ·
          tentativa <span id="tentativaNumero">-</span>
        </div>
      </div>
    </div>

    <!-- XP: os valores eram "+150 XP", "Nível 12", "1.250 XP", "2.000 XP para
         Nível 13" escritos no HTML. O XP ganho vem da resposta da submissão
         (o servidor é quem aplica RegrasGamificacao) e o nível, do perfil. -->
    <div class="card card--accent-top animate-in animate-in-delay-1">
      <div class="flex items-center gap-md">
        <div style="flex:1;">
          <h4 class="font-bold text-primary" id="xpGanho">-</h4>
          <p class="text-sm text-muted" id="resultadoNivel">-</p>
        </div>
        <i class="ti ti-bolt text-primary" style="font-size:24px;"></i>
      </div>
      <div class="progress mt-md mb-sm">
        <div class="progress__fill" id="resultadoBarraNivel" style="width:0%"></div>
      </div>
      <div class="flex justify-between text-xs text-muted">
        <span id="resultadoXpAtual">-</span>
        <span id="resultadoXpProximo">-</span>
      </div>
    </div>

    <!-- Medalha: o cartão só aparece se o servidor realmente concedeu alguma
         nesta tentativa. Antes anunciava "Mestre em Arrays" sempre. -->
    <div id="resultadoMedalhas"></div>

    <div class="card animate-in animate-in-delay-3">
      <div class="flex justify-between items-center mb-md">
        <h4 class="font-semibold">
          <i class="ti ti-clipboard-check text-primary" style="vertical-align:-2px;"></i>
          Revisão das questões
        </h4>
        <span class="badge badge--neutral" id="totalQuestoes">-</span>
      </div>
      <div id="revisaoProva"></div>
    </div>

    <div class="flex flex-col gap-sm mt-lg">
      <a href="#" id="linkVoltarCurso" class="btn btn--success btn--lg btn--full">
        Voltar ao curso <i class="ti ti-arrow-right"></i>
      </a>
      <a href="certificados.html" class="btn btn--ghost btn--full">
        <i class="ti ti-certificate"></i> Meus certificados
      </a>
    </div>

  </main>

</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
function onPageLoad() {
  renderResultadoProva();
  const raw = sessionStorage.getItem('tq_resultado');
  const idCurso = raw ? (JSON.parse(raw).id_curso || null) : null;
  const voltar = document.getElementById('linkVoltarCurso');
  if (voltar) voltar.href = idCurso ? 'curso.html?id=' + idCurso : 'cursos.html';
}
</script>
</body>
</html>
