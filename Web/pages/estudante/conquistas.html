<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conquistas — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <div class="top-bar__brand"><span>Tech Quest</span></div>
    <div class="top-bar__actions">
      <a href="notificacoes.html" class="top-bar__icon-btn"><i class="ti ti-bell" style="font-size:22px;"></i></a>
      <a href="perfil.html" class="js-iniciais top-bar__avatar">-</a>
    </div>
  </header>

  <main class="main-content">

    <h1 class="page-title animate-in">Minhas Conquistas 🏆</h1>
    <p class="page-subtitle">Sua jornada de aprendizado</p>

    <div class="flex gap-sm mb-lg animate-in animate-in-delay-1">
      <div class="card" style="flex:1; padding:var(--space-md); margin:0;">
        <div class="flex items-center gap-sm">
          <div class="list-item__icon" style="width:36px; height:36px;"><i class="ti ti-book-2"></i></div>
          <div>
            <div class="font-bold" style="font-size:18px;" id="conquistasProvas">-</div>
            <div class="text-xs text-muted">Provas aprovadas</div>
          </div>
        </div>
      </div>
      <div class="card" style="flex:1; padding:var(--space-md); margin:0; background:var(--color-warning-light); border-color:var(--color-warning);">
        <div class="flex items-center gap-sm">
          <div class="list-item__icon list-item__icon--warning" style="width:36px; height:36px;"><i class="ti ti-medal"></i></div>
          <div>
            <div class="font-bold" style="font-size:18px;" id="conquistasMedalhas">-</div>
            <div class="text-xs text-muted">Conquistas desbloqueadas</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tabs tabs--pills animate-in animate-in-delay-2">
      <button class="tab active" onclick="filtrarMedalhas('todas', this)">Todas</button>
      <button class="tab" id="abaConquistadas" onclick="filtrarMedalhas('conquistadas', this)">Conquistadas</button>
      <button class="tab" id="abaBloqueadas" onclick="filtrarMedalhas('bloqueadas', this)">Bloqueadas</button>
    </div>

    <div class="achievement-grid animate-in animate-in-delay-3" id="medalhasGrid">
      <!-- Renderizado via JS -->
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item active"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>
<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* O render das medalhas e as contagens ficam em app.js, na mesma funcao: eram
   duas fontes separadas e por isso o cabecalho dizia 5 conquistas com uma
   medalha de fato desbloqueada. */
function onPageLoad() { carregarConquistas(); }
</script>
</body>
</html>
