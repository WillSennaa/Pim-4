<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Certificados — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <div class="top-bar__brand"><span>Certificados</span></div>
    <div class="top-bar__actions">
      <a href="notificacoes.html" class="top-bar__icon-btn"><i class="ti ti-bell" style="font-size:22px;"></i></a>
      <a href="perfil.html" class="top-bar__avatar js-iniciais">-</a>
    </div>
  </header>

  <main class="main-content">

    <h1 class="page-title animate-in">Meus Certificados 📜</h1>
    <p class="page-subtitle">Comprovantes oficiais da sua jornada de aprendizado.</p>

    <!-- Estatísticas -->
    <div class="dashboard-grid mb-lg animate-in animate-in-delay-1">
      <!-- "BLOQUEADOS" saiu: pressupoe pre-requisito entre cursos, e o modelo
           nao tem essa relacao. O que existe e curso concluido (certificado
           emitido) e curso em andamento (certificado a emitir). -->
      <div class="card" style="margin:0; border-top:3px solid var(--color-success);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">EMITIDOS</div>
        <div class="font-bold" style="font-size:32px;" id="certEmitidos">-</div>
        <div class="text-xs text-success"><i class="ti ti-check"></i> Cursos concluídos</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid var(--color-warning);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">EM ANDAMENTO</div>
        <div class="font-bold" style="font-size:32px;" id="certAndamento">-</div>
        <div class="text-xs text-warning"><i class="ti ti-clock"></i> Ainda não concluídos</div>
      </div>
      <div class="card" style="margin:0; border-top:3px solid var(--color-primary);">
        <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">CARGA CERTIFICADA</div>
        <div class="font-bold" style="font-size:32px;" id="certHoras">-</div>
        <div class="text-xs text-muted">Soma da carga dos cursos concluídos</div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="tabs tabs--pills mb-lg animate-in animate-in-delay-2">
      <button class="tab active" onclick="filtrarCertificados('todos', this)">Todos</button>
      <button class="tab" onclick="filtrarCertificados('emitido', this)">Emitidos</button>
      <button class="tab" onclick="filtrarCertificados('andamento', this)">Em andamento</button>
    </div>

    <div class="courses-grid animate-in animate-in-delay-3" id="certificadosGrid"></div>

  </main>
<nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* O render saiu desta pagina para app.js (carregarCertificados). Motivo:
   os quatro cartoes de resumo e a lista precisam sair da MESMA consulta.
   O codigo antigo tambem lia c.nota_final, campo que a API nao devolve --
   um certificado emitido faria a tela estourar e nao renderizar nada. */
function onPageLoad() { carregarCertificados(); }
</script>
</body>
</html>
