<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão Completa da Prova — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <a href="javascript:history.back()" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
    <span class="top-bar__title">Revisão da Prova</span>
    <a href="perfil.html" class="js-iniciais top-bar__avatar">-</a>
  </header>

  <main class="main-content">

    <h1 class="page-title animate-in" id="resultadoProva">Revisão da prova</h1>
    <p class="page-subtitle">Todas as questões da sua última tentativa, com a alternativa
      que você marcou e a correta.</p>

    <div class="card animate-in animate-in-delay-1" style="border-top:4px solid var(--color-primary);">
      <div class="flex justify-between items-center" style="flex-wrap:wrap; gap:var(--space-md);">
        <div>
          <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">NOTA</div>
          <div class="font-bold" style="font-size:22px;" id="notaFinal">-</div>
          <div class="text-xs text-muted">mínima <span id="notaMinima">-</span> ·
            tentativa <span id="tentativaNumero">-</span></div>
        </div>
        <div class="text-right">
          <div class="text-xs text-muted font-semibold" style="letter-spacing:1px;">ACERTOS</div>
          <div class="font-bold" style="font-size:22px;" id="acertosTotal">-</div>
          <div class="text-xs text-muted" id="totalQuestoes">-</div>
        </div>
      </div>
    </div>

    <div id="revisaoProva" class="animate-in animate-in-delay-2"></div>

    <div class="flex flex-col gap-sm mt-lg">
      <a href="javascript:history.back()" class="btn btn--ghost btn--full">
        <i class="ti ti-arrow-left"></i> Voltar
      </a>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item active"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* A VERSÃO ANTERIOR SIMULAVA A CORREÇÃO. Ela lia o questoes.json pelo
   navegador (que trazia resposta_correta junto) e decidia no cliente quais
   questões o aluno teria acertado: "as primeiras N foram acertadas, o resto
   não". Nada disso vinha do servidor.

   Agora a correção real — letra marcada, letra correta e acerto, questão por
   questão — chega na resposta de POST /api/provas/{id}/tentativas e é a mesma
   fonte que as telas de aprovado e reprovado usam. Uma função só, em app.js:
   três telas mostrando o mesmo resultado não podem discordar. */
function onPageLoad() { renderResultadoProva(); }
</script>
</body>
</html>
