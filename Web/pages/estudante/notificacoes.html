<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <button class="top-bar__icon-btn"><i class="ti ti-menu-2" style="font-size:22px;"></i></button>
    <span class="top-bar__title text-primary font-bold" style="text-align:left;">Tech Quest</span>
    <a href="home.html" class="top-bar__icon-btn"><i class="ti ti-bell text-primary" style="font-size:22px;"></i></a>
  </header>

  <main class="main-content" style="display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:var(--space-3xl) var(--space-lg);">

    <div style="position:relative; margin-bottom:var(--space-xl);" class="animate-in">
      <div style="width:100px; height:100px; background:var(--color-surface); border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; color:var(--color-primary); font-size:48px; box-shadow:var(--shadow-md);">
        <i class="ti ti-bell-off"></i>
      </div>
      <div style="position:absolute; top:-5px; right:-5px; width:28px; height:28px; background:var(--color-warning); color:white; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; font-size:14px;">
        <i class="ti ti-spider"></i>
      </div>
    </div>

    <h1 style="font-size:24px; font-weight:700; margin-bottom:var(--space-sm);" class="animate-in animate-in-delay-1">Tudo em dia por aqui!</h1>
    <p class="text-secondary text-sm animate-in animate-in-delay-1" style="line-height:1.6; max-width:280px; margin-bottom:var(--space-xl);">
      Você não tem novas notificações no momento. Fique tranquilo, avisaremos quando surgir algo importante.
    </p>

    <a href="home.html" class="btn btn--primary btn--lg animate-in animate-in-delay-2">
      <i class="ti ti-arrow-left"></i> Voltar ao Início
    </a>

    <!-- Decorativo -->
    <div style="display:flex; gap:var(--space-md); margin-top:var(--space-3xl);" class="animate-in animate-in-delay-3">
      <div style="width:50px; height:50px; background:var(--color-primary-lighter); border-radius:var(--radius-md);"></div>
      <div style="width:50px; height:50px; background:var(--color-primary-light); border-radius:var(--radius-full);"></div>
      <div style="width:50px; height:50px; border:2px solid var(--color-primary-light); border-radius:var(--radius-md);"></div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>
<script src="../../js/app.js"></script>
</body>
</html>
