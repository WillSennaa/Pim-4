<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <header class="top-bar">
    <button class="top-bar__icon-btn"><i class="ti ti-menu-2" style="font-size:22px;"></i></button>
    <span class="top-bar__title text-primary font-bold" style="text-align:left;">Tech Quest</span>
    <a href="home.html" class="top-bar__icon-btn"><i class="ti ti-bell text-primary" style="font-size:22px;"></i></a>
  </header>

  <main class="main-content">

    <h1 class="page-title animate-in">Notificações</h1>
    <!-- Esta tela era um estado vazio permanente ("Tudo em dia por aqui"),
         igual para todo mundo. Não existe tabela de notificação no modelo —
         e criar uma duplicaria Chamado, que já guarda remetente, assunto,
         texto e data. O que chega ao usuário são as respostas do tutor e do
         administrador, e é isso que a lista mostra. -->
    <p class="page-subtitle">Respostas do seu tutor e da equipe de suporte.</p>

    <div id="listaNotificacoes" class="animate-in animate-in-delay-1">
      <div class="card"><p class="text-sm text-muted">Carregando...</p></div>
    </div>

    <div id="notificacoesVazio" style="display:none; text-align:center; padding:var(--space-2xl) 0;"
         class="animate-in animate-in-delay-1">
      <div style="width:84px; height:84px; margin:0 auto var(--space-lg); background:var(--color-surface);
                  border-radius:var(--radius-full); display:flex; align-items:center;
                  justify-content:center; color:var(--color-primary); font-size:40px;
                  box-shadow:var(--shadow-md);">
        <i class="ti ti-bell-off"></i>
      </div>
      <h2 style="font-size:20px; font-weight:700; margin-bottom:var(--space-sm);">Nenhuma mensagem</h2>
      <p class="text-secondary text-sm" style="line-height:1.6; max-width:320px; margin:0 auto var(--space-lg);">
        Quando o tutor responder uma dúvida sua, ou o suporte resolver um chamado,
        a resposta aparece aqui.
      </p>
      <a href="ajuda.html" class="btn btn--primary">
        <i class="ti ti-help-circle"></i> Central de Ajuda
      </a>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav__item"><i class="ti ti-home"></i><span>Home</span></a>
    <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book-2"></i><span>Cursos</span></a>
    <a href="conquistas.html" class="bottom-nav__item"><i class="ti ti-trophy"></i><span>Conquistas</span></a>
    <a href="ajuda.html" class="bottom-nav__item"><i class="ti ti-help-circle"></i><span>Ajuda</span></a>
    <a href="perfil.html" class="bottom-nav__item"><i class="ti ti-user"></i><span>Perfil</span></a>
  </nav>

</div>
<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
function onPageLoad() { carregarNotificacoes(); }
</script>
</body>
</html>
