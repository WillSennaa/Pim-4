<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando — Tech Quest</title>
</head>
<body>
<!--
  ESTA PAGINA ERA UMA COPIA.

  No PIM III cada curso tinha o seu proprio conjunto de arquivos: curso.html
  era "Fundamentos de C#" e curso-bd.html era "Banco de Dados e Modelagem",
  com as aulas, os textos e os numeros escritos a mao em cada um. Um curso novo
  exigiria criar arquivos novos -- e qualquer correcao de layout teria de ser
  feita duas vezes.

  Com a integracao, resultado-aprovado.html passou a receber o curso em ?id=, e o conteudo
  vem do banco. Nao ha mais o que duplicar aqui. O arquivo ficou como
  redirecionamento para que links antigos e favoritos continuem funcionando.
-->
<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  var q = p.toString();
  window.location.replace('resultado-aprovado.html' + (q ? '?' + q : ''));
})();
</script>
<noscript><a href="resultado-aprovado.html">Continuar</a></noscript>
</body>
</html>
