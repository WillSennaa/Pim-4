<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Curso — Tech Quest Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <aside class="sidebar-nav">
    <div class="sidebar-nav__brand"><i class="ti ti-shield-check"></i> Tech Quest Admin</div>
    <a href="home.html" class="sidebar-nav__item"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a href="usuarios.html" class="sidebar-nav__item"><i class="ti ti-users"></i> Usuários</a>
    <a href="cursos.html" class="sidebar-nav__item active"><i class="ti ti-book"></i> Cursos</a>
    <a href="aprovacoes.html" class="sidebar-nav__item"><i class="ti ti-checks"></i> Aprovações <span class="js-selo-aprovacoes badge badge--danger" style="margin-left:auto;">-</span></a>
    <a href="chamados.html" class="sidebar-nav__item"><i class="ti ti-lifebuoy"></i> Suporte</a>
    <a href="relatorios.html" class="sidebar-nav__item"><i class="ti ti-chart-pie"></i> Relatórios</a>
    <a href="configuracoes.html" class="sidebar-nav__item"><i class="ti ti-settings"></i> Configurações</a>
    <div style="flex:1;"></div>
    <a href="../../index.html" class="sidebar-nav__item" onclick="return confirmarSaida(event)"><i class="ti ti-logout"></i> Sair</a>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column;">

    <header class="top-bar">
      <a href="cursos.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
      <span class="top-bar__title">Detalhes do Curso</span>
      <div class="js-iniciais top-bar__avatar" style="background:#1E293B;">-</div>
    </header>

    <main class="main-content">
      <!-- Esta tela mostrava apenas nome, tutor, categoria e a CONTAGEM de
           aulas, tirados da lista de cursos. O administrador aprovava sem ler
           o conteudo. Agora ela carrega o curso completo de
           GET /api/admin/cursos/{id}: materiais com o texto e prova com o
           gabarito -- e e aqui que ele aprova ou rejeita. -->
      <div id="cursoRevisao">
        <div style="text-align:center; padding:var(--space-2xl);" class="text-muted">Carregando...</div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" class="bottom-nav__item"><i class="ti ti-layout-dashboard"></i><span>Dashboard</span></a>
      <a href="usuarios.html" class="bottom-nav__item"><i class="ti ti-users"></i><span>Usuários</span></a>
      <a href="cursos.html" class="bottom-nav__item active"><i class="ti ti-book"></i><span>Cursos</span></a>
      <a href="aprovacoes.html" class="bottom-nav__item"><i class="ti ti-checks"></i><span>Aprovar</span></a>
    </nav>

  </div>
</div>

<!-- Modais -->
<!-- Os modais "Suspender" e "Arquivar" sairam: nao existem no
     FluxoPublicacaoCurso. Os estados reais sao Rascunho, Pendente, Publicado
     e Rejeitado, e Publicado e final -- curso com aluno matriculado nao volta
     atras sem quebrar historico. -->
<div class="modal-overlay" id="modalRejeitarRevisao">
  <div class="modal">
    <div class="modal__icon modal__icon--danger"><i class="ti ti-x"></i></div>
    <h3 class="modal__title">Rejeitar este curso?</h3>
    <p class="modal__text">O curso volta a ser editável pelo tutor. Escreva o que precisa
      mudar — o motivo chega até ele como um chamado.</p>
    <div class="form-group">
      <textarea class="form-input" id="motivoRejeicao" rows="4"
        placeholder="Ex: o segundo material está sem conteúdo e a questão 3 não tem alternativa correta marcada."></textarea>
    </div>
    <div class="modal__actions">
      <button class="btn btn--danger btn--full" onclick="rejeitarDaRevisao(this)">Rejeitar curso</button>
      <button class="btn btn--secondary btn--full" onclick="fecharModal('modalRejeitarRevisao')">Cancelar</button>
    </div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
function onPageLoad() { carregarRevisaoCurso(); }
</script>
</body>
</html>
