<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Aluno — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <aside class="sidebar-nav">
    <div class="sidebar-nav__brand"><i class="ti ti-terminal-2"></i> Tech Quest</div>
    <a href="home.html" class="sidebar-nav__item"><i class="ti ti-layout-dashboard"></i> Painel</a>
    <a href="alunos.html" class="sidebar-nav__item active"><i class="ti ti-users"></i> Meus Alunos</a>
    <a href="duvidas.html" class="sidebar-nav__item"><i class="ti ti-message-circle"></i> Dúvidas</a>
    <a href="cursos.html" class="sidebar-nav__item"><i class="ti ti-book"></i> Meus Cursos</a>
    <div style="flex:1;"></div>
    <a href="../../index.html" class="sidebar-nav__item" onclick="return confirmarSaida(event)"><i class="ti ti-logout"></i> Sair</a>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column;">

    <header class="top-bar">
      <a href="alunos.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
      <span class="top-bar__title">Perfil do Aluno</span>
      <a href="../conta/perfil.html" class="top-bar__avatar" style="background:#FDA4AF; color:#9F1239;" title="Meu perfil">AS</a>
    </header>

    <main class="main-content" id="alunoDetalhe">
      <div style="text-align:center; padding:var(--space-2xl);" class="text-muted">Carregando...</div>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" class="bottom-nav__item"><i class="ti ti-layout-dashboard"></i><span>Painel</span></a>
      <a href="alunos.html" class="bottom-nav__item active"><i class="ti ti-users"></i><span>Alunos</span></a>
      <a href="duvidas.html" class="bottom-nav__item"><i class="ti ti-message-circle"></i><span>Dúvidas</span></a>
      <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book"></i><span>Cursos</span></a>
    </nav>

  </div>
</div>

<!-- Modal mensagem -->
<div class="modal-overlay" id="modalMensagem">
  <div class="modal">
    <div class="modal__icon modal__icon--primary"><i class="ti ti-message-circle"></i></div>
    <h3 class="modal__title">Enviar mensagem</h3>
    <p class="modal__text">Sua mensagem chegará na caixa de notificações do aluno.</p>
    <textarea class="form-input mb-md" id="mensagemAluno" rows="4" placeholder="Olá! Notei seu progresso e..."></textarea>
    <div class="modal__actions">
      <button class="btn btn--primary btn--full" onclick="enviarMensagemAluno(ALUNO_ATUAL, this)"><i class="ti ti-send"></i> Enviar</button>
      <button class="btn btn--secondary btn--full" onclick="fecharModal('modalMensagem')">Cancelar</button>
    </div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* ALUNO_ATUAL guarda o ID_Usuario do estudante, que e para quem o chamado da
   mensagem e endereçado -- nao o ID_Estudante, que identifica a matricula. */
let ALUNO_ATUAL = null;

function onPageLoad() {
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  const alunos = (TQ.data && TQ.data.tutor_alunos) || [];
  const a = alunos.find(x => x.id_estudante === id) || alunos[0];

  const alvo = document.getElementById('alunoDetalhe');
  if (!a) {
    if (alvo) alvo.innerHTML = '<div class="card"><p class="text-sm text-muted">Aluno nao encontrado.</p></div>';
    return;
  }
  ALUNO_ATUAL = a.id_usuario || null;

  if (alvo) {
    alvo.innerHTML = `
      <div class="card">
        <div class="flex items-center gap-md mb-md">
          <div class="avatar">${FMT.iniciais(a.nome)}</div>
          <div style="flex:1;">
            <div class="font-semibold">${a.nome}</div>
            <div class="text-sm text-muted">${a.email || ''}</div>
          </div>
        </div>
        <div class="flex justify-between mb-sm"><span class="text-secondary">Curso</span>
          <span class="font-medium">${a.curso}</span></div>
        <div class="flex justify-between mb-sm"><span class="text-secondary">Progresso</span>
          <span class="font-medium">${a.progresso}%</span></div>
        <div class="progress mb-md"><div class="progress__fill" style="width:${a.progresso}%"></div></div>
        <div class="flex justify-between mb-sm"><span class="text-secondary">Melhor nota</span>
          <span class="font-medium">${a.melhor_nota != null ? a.melhor_nota.toFixed(1) : 'sem prova'}</span></div>
        <div class="flex justify-between"><span class="text-secondary">Tentativas</span>
          <span class="font-medium">${a.tentativas || 0}</span></div>
      </div>`;
  }
}
</script>
</body>
</html>
