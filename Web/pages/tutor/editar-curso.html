<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Curso — Tutor — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <aside class="sidebar-nav">
    <div class="sidebar-nav__brand"><i class="ti ti-terminal-2"></i> Tech Quest</div>
    <a href="home.html" class="sidebar-nav__item"><i class="ti ti-layout-dashboard"></i> Painel</a>
    <a href="alunos.html" class="sidebar-nav__item"><i class="ti ti-users"></i> Meus Alunos</a>
    <a href="duvidas.html" class="sidebar-nav__item"><i class="ti ti-message-circle"></i> Dúvidas</a>
    <a href="cursos.html" class="sidebar-nav__item active"><i class="ti ti-book"></i> Meus Cursos</a>
    <div style="flex:1;"></div>
    <a href="../../index.html" class="sidebar-nav__item" onclick="return confirmarSaida(event)"><i class="ti ti-logout"></i> Sair</a>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column;">

    <header class="top-bar">
      <a href="cursos.html" class="top-bar__back" onclick="return verificarAlteracoes(event)"><i class="ti ti-arrow-left"></i></a>
      <span class="top-bar__title">Editar Curso</span>
      <button class="btn btn--sm btn--primary" onclick="abrirModal('modalSalvar')" style="font-size:13px;">Salvar</button>
    </header>

    <main class="main-content" id="cursoEditor">
      <!-- Renderizado via JS -->
      <div style="text-align:center; padding:var(--space-2xl);" class="text-muted">Carregando...</div>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" class="bottom-nav__item"><i class="ti ti-layout-dashboard"></i><span>Painel</span></a>
      <a href="alunos.html" class="bottom-nav__item"><i class="ti ti-users"></i><span>Alunos</span></a>
      <a href="duvidas.html" class="bottom-nav__item"><i class="ti ti-message-circle"></i><span>Dúvidas</span></a>
      <a href="cursos.html" class="bottom-nav__item active"><i class="ti ti-book"></i><span>Cursos</span></a>
    </nav>

  </div>
</div>

<!-- Modal salvar -->
<div class="modal-overlay" id="modalSalvar">
  <div class="modal">
    <div class="modal__icon modal__icon--success"><i class="ti ti-device-floppy"></i></div>
    <h3 class="modal__title">Salvar alterações?</h3>
    <p class="modal__text">As alterações nos módulos passarão por revisão antes de serem aplicadas ao curso publicado.</p>
    <div class="modal__actions">
      <button class="btn btn--success btn--full" onclick="fecharModal('modalSalvar'); alert('✓ Alterações salvas e enviadas para revisão!'); window.location.href='cursos.html';">Sim, salvar</button>
      <button class="btn btn--secondary btn--full" onclick="fecharModal('modalSalvar')">Continuar editando</button>
    </div>
  </div>
</div>

<!-- Modal sair -->
<div class="modal-overlay" id="modalSair">
  <div class="modal">
    <div class="modal__icon modal__icon--warning"><i class="ti ti-logout"></i></div>
    <h3 class="modal__title">Sair da conta?</h3>
    <p class="modal__text">Você precisará fazer login novamente.</p>
    <div class="modal__actions">
      <a href="../../index.html" class="btn btn--danger btn--full">Sim, sair</a>
      <button class="btn btn--secondary btn--full" onclick="fecharModal('modalSair')">Cancelar</button>
    </div>
  </div>
</div>

<script src="../../js/app.js"></script>
<script>
function confirmarSaida(e) {
  e.preventDefault();
  abrirModal('modalSair');
  return false;
}

function verificarAlteracoes(e) {
  return true; // por simplicidade não vamos rastrear alterações nesse mock
}

function onPageLoad() {
  if (!TQ.data || !TQ.data.tutor_meus_cursos) return;
  const id = new URLSearchParams(window.location.search).get('id') || TQ.data.tutor_meus_cursos[0].id;
  const c = TQ.data.tutor_meus_cursos.find(x => x.id === id) || TQ.data.tutor_meus_cursos[0];

  const statusBadge = {
    'publicado': { class: 'success', label: 'PUBLICADO' },
    'rascunho': { class: 'neutral', label: 'RASCUNHO' },
    'aguardando': { class: 'warning', label: 'AGUARDANDO APROVAÇÃO' }
  };
  const b = statusBadge[c.status];

  document.getElementById('cursoEditor').innerHTML = `
    <div class="flex justify-between items-start mb-md animate-in" style="flex-wrap:wrap; gap:var(--space-md);">
      <div>
        <span class="badge badge--${b.class}">${b.label}</span>
        <h1 class="page-title mt-sm" style="margin-bottom:4px;">${c.titulo}</h1>
        <p class="text-secondary">Edite informações, módulos e conteúdo do curso</p>
      </div>
    </div>

    <!-- Informações Básicas -->
    <div class="card animate-in animate-in-delay-1" style="border-top:4px solid var(--color-primary);">
      <h3 class="font-bold mb-md"><i class="ti ti-info-square text-primary" style="vertical-align:-2px;"></i> Informações Básicas</h3>

      <div class="form-group">
        <label class="form-label">Título do curso</label>
        <input type="text" class="form-input" value="${c.titulo}">
      </div>

      <div class="form-group">
        <label class="form-label">Descrição</label>
        <textarea class="form-input" rows="3">Curso completo com ${c.modulos} módulos cobrindo desde fundamentos até tópicos avançados.</textarea>
      </div>

      <div class="flex gap-md" style="flex-wrap:wrap;">
        <div class="form-group" style="flex:1; min-width:160px;">
          <label class="form-label">Categoria</label>
          <select class="form-input">
            <option>Programação</option>
            <option>Database</option>
            <option>Frontend</option>
            <option>Backend</option>
            <option>DevOps</option>
          </select>
        </div>
        <div class="form-group" style="flex:1; min-width:160px;">
          <label class="form-label">Nível</label>
          <select class="form-input">
            <option>Iniciante</option>
            <option>Intermediário</option>
            <option>Avançado</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Módulos -->
    <div class="card animate-in animate-in-delay-2" style="border-top:4px solid var(--color-warning);">
      <div class="flex justify-between items-center mb-md">
        <h3 class="font-bold"><i class="ti ti-stack-2 text-warning" style="vertical-align:-2px;"></i> Módulos do curso</h3>
        <button class="btn btn--secondary btn--sm" onclick="adicionarModulo()"><i class="ti ti-plus"></i> Adicionar módulo</button>
      </div>

      <div id="modulosList">
        ${[1,2,3,4].slice(0, c.modulos).map(i => `
          <div class="module-item" style="margin-bottom:var(--space-md);">
            <div class="module-item__icon" style="background:var(--color-primary-light); color:var(--color-primary-dark);">${i}</div>
            <div class="module-item__body">
              <div class="module-item__card">
                <input type="text" class="form-input mb-sm" value="Módulo ${i} - ${['Introdução', 'Sintaxe', 'Estruturas de Dados', 'Tópicos Avançados'][i-1] || 'Avançado'}" style="font-weight:600;">
                <textarea class="form-input" rows="2" placeholder="Descrição do módulo...">Descrição detalhada do conteúdo deste módulo, objetivos de aprendizagem e exercícios.</textarea>
                <div class="flex gap-sm mt-md">
                  <button class="btn btn--ghost btn--sm" onclick="alert('📝 Editor de aulas em desenvolvimento!');"><i class="ti ti-edit"></i> Editar aulas</button>
                  <button class="btn btn--ghost btn--sm" onclick="if(confirm('Remover este módulo?')) this.closest('.module-item').remove();" style="color:var(--color-danger);"><i class="ti ti-trash"></i></button>
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Materiais -->
    <div class="card animate-in animate-in-delay-2" style="border-top:4px solid var(--color-success);">
      <h3 class="font-bold mb-md"><i class="ti ti-file text-success" style="vertical-align:-2px;"></i> Materiais de apoio</h3>
      <div style="border:2px dashed var(--color-border); border-radius:var(--radius-md); padding:var(--space-lg); text-align:center; cursor:pointer;">
        <i class="ti ti-cloud-upload" style="font-size:32px; color:var(--color-text-muted);"></i>
        <p class="text-sm text-muted mt-sm">Arraste arquivos ou clique para selecionar</p>
        <p class="text-xs text-muted">PDFs, slides, vídeos (máx. 100MB por arquivo)</p>
      </div>
    </div>

    <!-- Ações -->
    <div class="flex flex-col gap-sm mt-lg">
      <button class="btn btn--primary btn--lg btn--full" onclick="abrirModal('modalSalvar')">
        <i class="ti ti-device-floppy"></i> Salvar alterações
      </button>
      <a href="cursos.html" class="btn btn--ghost btn--full">Cancelar</a>
    </div>
  `;
}

function adicionarModulo() {
  const list = document.getElementById('modulosList');
  const n = list.querySelectorAll('.module-item').length + 1;
  const div = document.createElement('div');
  div.className = 'module-item';
  div.style.marginBottom = 'var(--space-md)';
  div.innerHTML = `
    <div class="module-item__icon" style="background:var(--color-primary-light); color:var(--color-primary-dark);">${n}</div>
    <div class="module-item__body">
      <div class="module-item__card">
        <input type="text" class="form-input mb-sm" placeholder="Título do módulo" style="font-weight:600;">
        <textarea class="form-input" rows="2" placeholder="Descrição do módulo..."></textarea>
        <div class="flex gap-sm mt-md">
          <button class="btn btn--ghost btn--sm" onclick="alert('📝 Editor de aulas em desenvolvimento!');"><i class="ti ti-edit"></i> Editar aulas</button>
          <button class="btn btn--ghost btn--sm" onclick="this.closest('.module-item').remove();" style="color:var(--color-danger);"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>
  `;
  list.appendChild(div);
}
</script>
</body>
</html>
