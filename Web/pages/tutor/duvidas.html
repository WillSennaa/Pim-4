<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dúvidas dos Alunos — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <aside class="sidebar-nav">
    <div class="sidebar-nav__brand"><i class="ti ti-terminal-2"></i> Tech Quest</div>
    <a href="home.html" class="sidebar-nav__item"><i class="ti ti-layout-dashboard"></i> Painel</a>
    <a href="alunos.html" class="sidebar-nav__item"><i class="ti ti-users"></i> Meus Alunos</a>
    <div class="sidebar-nav__item active"><i class="ti ti-message-circle"></i> Dúvidas</div>
    <a href="cursos.html" class="sidebar-nav__item"><i class="ti ti-book"></i> Meus Cursos</a>
    <div style="flex:1;"></div>
    <a href="../../index.html" class="sidebar-nav__item" onclick="return confirmarSaida(event)"><i class="ti ti-logout"></i> Sair</a>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column;">

    <header class="top-bar">
      <a href="home.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
      <span class="top-bar__title">Dúvidas</span>
      <a href="../conta/perfil.html" class="top-bar__avatar" style="background:#FDA4AF; color:#9F1239;" title="Meu perfil">AS</a>
    </header>

    <main class="main-content">

      <h1 class="page-title animate-in">Dúvidas dos Alunos</h1>
      <p class="page-subtitle">Responda as perguntas de quem precisa da sua orientação.</p>

      <div class="tabs tabs--pills mb-lg animate-in animate-in-delay-1">
        <button class="tab active" data-filtro="pendentes" onclick="filtrarDuvidas('pendentes', this)">Pendentes</button>
        <button class="tab" data-filtro="respondidas" onclick="filtrarDuvidas('respondidas', this)">Respondidas</button>
        <button class="tab" data-filtro="todas" onclick="filtrarDuvidas('todas', this)">Todas</button>
      </div>

      <div id="duvidasList" class="animate-in animate-in-delay-2"></div>

    </main>
<nav class="bottom-nav">
      <a href="home.html" class="bottom-nav__item"><i class="ti ti-layout-dashboard"></i><span>Painel</span></a>
      <a href="alunos.html" class="bottom-nav__item"><i class="ti ti-users"></i><span>Alunos</span></a>
      <a href="duvidas.html" class="bottom-nav__item active"><i class="ti ti-message-circle"></i><span>Dúvidas</span></a>
      <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book"></i><span>Cursos</span></a>
    </nav>

  </div>
</div>

<!-- Modal responder -->
<div class="modal-overlay" id="modalResponder">
  <div class="modal">
    <div class="modal__icon modal__icon--primary"><i class="ti ti-message-reply"></i></div>
    <h3 class="modal__title">Responder dúvida</h3>
    <p class="modal__text">Sua resposta chegará por notificação ao aluno e ficará visível para outros estudantes com a mesma dúvida.</p>
    <div id="perguntaOriginal" class="card mb-md" style="background:var(--color-surface-2);"></div>
      <textarea class="form-input mb-md" id="respostaDuvida" rows="5" placeholder="Digite sua resposta detalhada..."></textarea>
    <div class="modal__actions">
      <button class="btn btn--primary btn--full" onclick="responderDuvida(DUVIDA_ATUAL.id, DUVIDA_ATUAL.idRemetente, this)"><i class="ti ti-send"></i> Enviar resposta</button>
      <button class="btn btn--secondary btn--full" onclick="fecharModal('modalResponder')">Cancelar</button>
    </div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* O painel mostra as duvidas ENDERECADAS a este tutor, com o curso de cada
   uma -- o roteamento acontece no servidor: o aluno escolhe o curso e a
   duvida chega a quem o criou. */
let DUVIDA_ATUAL = { id: null, idRemetente: null };

function abrirResposta(id, idRemetente, aluno, pergunta, curso) {
  DUVIDA_ATUAL = { id: id, idRemetente: idRemetente };
  const alvo = document.getElementById('perguntaOriginal');
  if (alvo) {
    alvo.innerHTML = '<strong>' + aluno + '</strong>' +
      '<div class="text-xs text-muted mb-sm">' + curso + '</div>' +
      '<span class="text-sm">' + pergunta + '</span>';
  }
  const campo = document.getElementById('respostaDuvida');
  if (campo) campo.value = '';
  abrirModal('modalResponder');
}

function onPageLoad() {
  const list = document.getElementById('duvidasList');
  if (!list) return;

  const duvidas = (TQ.data && TQ.data.tutor_duvidas) || [];
  if (!duvidas.length) {
    list.innerHTML = '<div class="card"><p class="text-sm text-muted">' +
      'Nenhuma duvida recebida. Quando um aluno abrir uma duvida sobre um dos ' +
      'seus cursos, ela aparece aqui.</p></div>';
    return;
  }

  const CORES = { 'Aberto': 'warning', 'Em andamento': 'primary', 'Resolvido': 'success' };

  list.innerHTML = duvidas.map(d => {
    const texto = (d.pergunta || '').replace(/'/g, "&#39;").replace(/"/g, '&quot;');
    const aluno = (d.aluno || '').replace(/'/g, "&#39;");
    const curso = (d.curso || '').replace(/'/g, "&#39;");
    const cor = CORES[d.status] || 'neutral';

    return `
    <div class="card" data-situacao="${d.pendente ? 'pendentes' : 'respondidas'}"
         style="border-left:3px solid var(--color-${cor});">
      <div class="flex items-start gap-md mb-md">
        <div class="avatar">${d.iniciais}</div>
        <div style="flex:1;">
          <div class="flex justify-between items-center">
            <strong>${d.aluno}</strong>
            <span class="badge badge--${cor}">${(d.status || '').toUpperCase()}</span>
          </div>
          <div class="text-xs text-muted mb-sm">
            <i class="ti ti-book-2"></i> ${d.curso} - ${d.tempo}
          </div>
          <div class="font-medium text-sm">${d.assunto || ''}</div>
          <p class="text-sm">${d.pergunta}</p>
        </div>
      </div>
      ${d.pendente ? `
      <div class="flex gap-sm">
        <button class="btn btn--primary btn--sm" style="flex:1;"
                onclick="abrirResposta(${d.id}, ${d.id_remetente || 'null'}, '${aluno}', '${texto}', '${curso}')">
          <i class="ti ti-message-reply"></i> Responder
        </button>
        ${d.status === 'Aberto' ? `
        <button class="btn btn--ghost btn--sm" onclick="marcarEmAndamento(${d.id}, this)">
          Estou analisando
        </button>` : ''}
        <button class="btn btn--ghost btn--sm" onclick="encerrarDuvida(${d.id}, this)">
          Encerrar
        </button>
      </div>` : ''}
    </div>`;
  }).join('');

  list.insertAdjacentHTML('afterend',
    '<div id="duvidasVazio" style="display:none;"><div class="card">' +
    '<p class="text-sm text-muted">Nenhuma duvida nesta situacao.</p></div></div>');

  // A aba Pendentes ja vem marcada no HTML; aplica o filtro correspondente.
  filtrarDuvidas('pendentes', document.querySelector('.tab[data-filtro="pendentes"]'));
}
</script>
</body>
</html>
