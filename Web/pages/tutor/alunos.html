<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Alunos — Tech Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-container app-container--wide">

  <aside class="sidebar-nav">
    <div class="sidebar-nav__brand"><i class="ti ti-terminal-2"></i> Tech Quest</div>
    <a href="home.html" class="sidebar-nav__item"><i class="ti ti-layout-dashboard"></i> Painel</a>
    <div class="sidebar-nav__item active"><i class="ti ti-users"></i> Meus Alunos</div>
    <a href="duvidas.html" class="sidebar-nav__item"><i class="ti ti-message-circle"></i> Dúvidas</a>
    <a href="cursos.html" class="sidebar-nav__item"><i class="ti ti-book"></i> Meus Cursos</a>
    <div style="flex:1;"></div>
    <a href="../../index.html" class="sidebar-nav__item" onclick="return confirmarSaida(event)"><i class="ti ti-logout"></i> Sair</a>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column;">

    <header class="top-bar">
      <a href="home.html" class="top-bar__back"><i class="ti ti-arrow-left"></i></a>
      <span class="top-bar__title">Meus Alunos</span>
      <a href="../conta/perfil.html" class="top-bar__avatar" style="background:#FDA4AF; color:#9F1239;" title="Meu perfil">AS</a>
    </header>

    <main class="main-content">

      <h1 class="page-title animate-in">Meus Alunos</h1>
      <p class="page-subtitle">Acompanhe o progresso de cada aluno em seus cursos.</p>

      <!-- Busca -->
      <div class="card animate-in animate-in-delay-1">
        <div class="form-input-wrapper">
          <i class="ti ti-search"></i>
          <input type="text" class="form-input form-input--with-icon" id="buscaAluno" placeholder="Buscar aluno por nome ou e-mail...">
        </div>
      </div>

      <!-- Tabela (desktop) / Cards (mobile) -->
      <div class="card card--no-padding animate-in animate-in-delay-2">
        <div style="overflow-x:auto;">
          <table class="data-table" id="alunosTable">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Curso</th>
                <th>Progresso</th>
                <th>Melhor nota</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="alunosTableBody"></tbody>
          </table>
        </div>
      </div>

    </main>
<nav class="bottom-nav">
      <a href="home.html" class="bottom-nav__item"><i class="ti ti-layout-dashboard"></i><span>Painel</span></a>
      <a href="alunos.html" class="bottom-nav__item active"><i class="ti ti-users"></i><span>Alunos</span></a>
      <a href="duvidas.html" class="bottom-nav__item"><i class="ti ti-message-circle"></i><span>Dúvidas</span></a>
      <a href="cursos.html" class="bottom-nav__item"><i class="ti ti-book"></i><span>Cursos</span></a>
    </nav>

  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script>
/* A busca filtra as linhas ja carregadas: os alunos do tutor sao poucos e
   estao todos na tela, entao uma ida ao servidor a cada tecla so adicionaria
   latencia -- que com a API na nuvem e de rede. */
function onPageLoad() {
  const corpo = document.getElementById('alunosTableBody');
  if (!corpo) return;

  const alunos = (TQ.data && TQ.data.tutor_alunos) || [];
  if (!alunos.length) {
    corpo.innerHTML = '<tr><td colspan="5"><p class="text-sm text-muted">' +
      'Nenhum aluno matriculado nos seus cursos ainda.</p></td></tr>';
    return;
  }

  corpo.innerHTML = alunos.map(a => `
    <tr data-busca="${((a.nome || '') + ' ' + (a.email || '')).toLowerCase()}">
      <td>
        <div class="flex items-center gap-sm">
          <div class="avatar avatar--sm">${FMT.iniciais(a.nome)}</div>
          <div>
            <div class="font-medium">${a.nome}</div>
            <div class="text-xs text-muted">${a.email || ''}</div>
          </div>
        </div>
      </td>
      <td class="text-sm">${a.curso}</td>
      <td style="min-width:140px;">
        <div class="flex justify-between text-xs mb-sm">
          <span class="text-muted">${a.progresso}%</span>
        </div>
        <div class="progress"><div class="progress__fill" style="width:${a.progresso}%"></div></div>
      </td>
      <td class="text-sm">${a.melhor_nota != null ? a.melhor_nota.toFixed(1) : 'sem prova'}</td>
      <td><a href="aluno-detalhe.html?id=${a.id_estudante}" class="btn btn--ghost btn--sm">Ver perfil</a></td>
    </tr>`).join('');

  const busca = document.getElementById('buscaAluno');
  if (busca) busca.addEventListener('input', filtrarAlunos);
}
</script>
</body>
</html>
